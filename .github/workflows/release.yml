name: CMP Release (reusable)

# Reusable release workflow for Compose Multiplatform apps: one run versions both
# platforms identically, and — critically — only pushes the release tag AFTER both
# platforms are known to build. This prevents "orphan tags": a vX.Y.Z pushed for a
# release that then fails to build on one platform (which would also skew the next
# auto-bump, since that reads the latest tag).
#
# DAG (build-before-tag):
#
#   version ─┬─> compile-android ─┐
#            └─> build-ios ───────┴─> tag ─┬─> publish-android
#                                          └─> publish-ios
#
#   version          Resolve the shared version (name/code/tag/build). NO tag push.
#   compile-android  Build the release AAB to prove Android compiles + signs. Gate only.
#   build-ios        match → gym → .ipa (build-once). Uploads the .ipa artifact. No upload.
#   tag              Push vX.Y.Z — reached only if BOTH build jobs succeeded (an
#                    unconfigured iOS is SKIPPED, which does not block; a FAILED iOS build
#                    does block, so nothing ships).
#   publish-android  Rebuild + publish to Play (GPP) + GitHub Release. Cheap ubuntu rebuild
#                    keeps the app's Gradle config unchanged (no artifactDir wiring needed).
#   publish-ios      Download the .ipa and upload to TestFlight (pilot). No rebuild — the
#                    expensive macOS build already happened in build-ios.
#
# Call it from an app repo (see README.md):
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: gowthamraj07/mobile-ci/.github/workflows/release.yml@v1
#       with:
#         track: ${{ inputs.track || 'internal' }}
#         versionName: ${{ inputs.versionName }}
#       secrets: inherit
#
# Conventions the caller app must follow (all overridable via inputs):
#   - Android module named `composeApp`, reading -PappVersionCode / -PappVersionName
#     and publishing via GPP behind -PenablePlayPublisher (see the app's build.gradle.kts).
#   - iOS fastlane project under `iosApp/` exposing TWO lanes (this is the build-before-tag
#     change vs. the old single `beta` lane):
#       * `build`  — match(readonly) → gym; leaves the signed .ipa under the ios-directory.
#                    Honours the BUILD_NUMBER and MARKETING_VERSION env vars.
#       * `upload` — pilot/upload_to_testflight of the .ipa at ENV["IPA_PATH"].
#     Override the lane names with ios-build-lane / ios-upload-lane if yours differ.
on:
  workflow_call:
    inputs:
      android-module:
        description: Gradle module that produces the AAB.
        type: string
        default: composeApp
      ios-directory:
        description: Directory holding the iOS fastlane project.
        type: string
        default: iosApp
      ios-build-lane:
        description: fastlane iOS lane that builds the .ipa (match → gym), no upload.
        type: string
        default: build
      ios-upload-lane:
        description: fastlane iOS lane that uploads ENV["IPA_PATH"] to TestFlight (pilot).
        type: string
        default: upload
      java-version:
        type: string
        default: "17"
      ruby-version:
        type: string
        default: "3.3"
      track:
        description: Play track to publish to.
        type: string
        default: internal
      versionName:
        description: versionName override (e.g. 1.4.0); blank = auto-bump the patch.
        type: string
        default: ""
      android-prebuild-gradle-task:
        description: >-
          Optional Gradle task run on the Android jobs before bundleRelease (e.g. to
          inject build-time config). Blank = skipped. Runs after EXTRA_GRADLE_PROPERTIES
          is applied, so it can read those properties.
        type: string
        default: ""
      ios-prebuild-gradle-task:
        description: >-
          Optional Gradle task run on the iOS build job before fastlane (e.g.
          ":composeApp:updateIosPlist" to embed an mTLS cert password into Info.plist).
          Blank = skipped. Runs after EXTRA_GRADLE_PROPERTIES is applied.
        type: string
        default: ""
    secrets:
      RELEASE_KEYSTORE_B64: { required: false }
      RELEASE_STORE_PASSWORD: { required: false }
      RELEASE_KEY_ALIAS: { required: false }
      RELEASE_KEY_PASSWORD: { required: false }
      PLAY_SERVICE_ACCOUNT_JSON: { required: false }
      MATCH_GIT_URL: { required: false }
      MATCH_PASSWORD: { required: false }
      MATCH_GIT_BASIC_AUTHORIZATION: { required: false }
      # SSH private key for match repos accessed over git@/ssh:// (alternative to the
      # HTTPS MATCH_GIT_BASIC_AUTHORIZATION). When set, an ssh-agent is started before
      # fastlane. Unset → no agent (HTTPS/other apps unaffected).
      MATCH_GIT_SSH_KEY: { required: false }
      APP_STORE_CONNECT_API_KEY_ID: { required: false }
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: { required: false }
      APP_STORE_CONNECT_API_KEY_P8: { required: false }
      APPLE_TEAM_ID: { required: false }
      # Optional multiline `key=value` block appended to gradle.properties on the build
      # jobs before the build. For apps that feed build-time secrets into Gradle (e.g.
      # mTLS client-cert passwords read via project.findProperty and baked into
      # BuildConfig / Info.plist). Unset → nothing is appended.
      EXTRA_GRADLE_PROPERTIES: { required: false }

jobs:
  # ---------------------------------------------------------------------------
  # Single source of truth for the version. Every downstream job consumes its
  # outputs, so Android and iOS can never drift apart. Unlike the old workflow,
  # this job DOES NOT push the tag — that happens in `tag`, after both platforms
  # have been shown to build. The github context here reflects the CALLER's
  # triggering event (tag push vs. workflow_dispatch).
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      android_ready: ${{ steps.publish.outputs.android }}
      ios_ready: ${{ steps.publish.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full tag history — the version fallback reads the latest tag

      # Resolve versionName, then derive everything from it:
      #   - tag push (v1.4.3)                → 1.4.3
      #   - manual dispatch + versionName    → the value you type
      #   - manual dispatch, no versionName  → latest tag with the patch bumped (v1.4.2 → 1.4.3)
      # Android versionCode = major*10000 + minor*100 + patch (1.4.3 → 10403): deterministic
      # per version and monotonic across releases, so it always exceeds the live Play code
      # and can't regress ("does not allow any existing users to upgrade"). Constraints:
      # minor < 100 and patch < 100. iOS build number is the run number (unique per version).
      - name: Compute version
        id: version
        env:
          # Passed via env (not inline ${{ }}) so a crafted input can't inject shell.
          VERSION_NAME_INPUT: ${{ inputs.versionName }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$VERSION_NAME_INPUT" ]; then
            NAME="$VERSION_NAME_INPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            # No version supplied: bump the patch of the highest existing vX.Y.Z tag.
            LATEST="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            LATEST="${LATEST#v}"
            IFS='.' read -r LMAJOR LMINOR LPATCH <<< "${LATEST%%-*}"
            NAME="${LMAJOR:-0}.${LMINOR:-0}.$(( ${LPATCH:-0} + 1 ))"
          fi
          # Strip any pre-release/build suffix (e.g. 1.4.0-rc1 → 1.4.0) before parsing.
          CORE="${NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          {
            echo "code=${CODE}"
            echo "name=${NAME}"
            echo "tag=v${NAME}"
            echo "build=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing versionName=${NAME} tag=v${NAME} androidCode=${CODE} iosBuild=${GITHUB_RUN_NUMBER}"

      # Per-platform publishability. `ios` gates the iOS jobs so they're cleanly SKIPPED
      # (not failed) until the Apple credentials exist — Android still releases. The
      # combined flag decides whether a manual release should create a tag (a pure
      # dry-run must not pollute the tag history).
      - name: Detect publishability
        id: publish
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ANDROID=false; IOS=false
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then ANDROID=true; fi
          if [ -n "$MATCH_GIT_URL" ] && [ -n "$MATCH_PASSWORD" ] && [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] \
             && [ -n "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_P8" ] \
             && [ -n "$APPLE_TEAM_ID" ]; then IOS=true; fi
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          [ "$IOS" = "true" ] || echo "::warning::Apple release secrets not set — the iOS jobs will be skipped (Android still releases). Add them to ship iOS at the same version."

  # ---------------------------------------------------------------------------
  # Gate: prove the Android release AAB compiles + signs with the resolved
  # version. Nothing is uploaded or published here — this exists only so the
  # `tag` job can require a green Android build. The real build+publish happens
  # in publish-android (cheap ubuntu rebuild — no app-side Gradle change needed).
  # ---------------------------------------------------------------------------
  compile-android:
    name: Android build (gate)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read    # resolve a shared version catalog if the app consumes one
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true

      - name: Apply extra gradle.properties
        env:
          EXTRA_GRADLE_PROPERTIES: ${{ secrets.EXTRA_GRADLE_PROPERTIES }}
        run: |
          if [ -z "$EXTRA_GRADLE_PROPERTIES" ]; then
            echo "EXTRA_GRADLE_PROPERTIES not set — skipping."
            exit 0
          fi
          printf '\n%s\n' "$EXTRA_GRADLE_PROPERTIES" >> gradle.properties
          echo "Appended $(printf '%s' "$EXTRA_GRADLE_PROPERTIES" | grep -c '=') extra gradle propert(ies)."

      # Same signing setup as the publish job so the gate also proves signing works.
      - name: Configure release signing
        id: signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD<<__EOF__"
              echo "$RELEASE_STORE_PASSWORD"
              echo "__EOF__"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS<<__EOF__"
              echo "$RELEASE_KEY_ALIAS"
              echo "__EOF__"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD<<__EOF__"
              echo "$RELEASE_KEY_PASSWORD"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_B64 not set — building a DEBUG-signed AAB (dry-run gate)."
          fi

      - name: Android pre-build Gradle task
        if: ${{ inputs.android-prebuild-gradle-task != '' }}
        run: >-
          ./gradlew ${{ inputs.android-prebuild-gradle-task }}
          -PappVersionCode=${{ needs.version.outputs.code }}
          -PappVersionName=${{ needs.version.outputs.name }}
          --stacktrace

      - name: Build release bundle (gate)
        run: >-
          ./gradlew :${{ inputs.android-module }}:bundleRelease
          -PappVersionCode=${{ needs.version.outputs.code }}
          -PappVersionName=${{ needs.version.outputs.name }}
          --stacktrace

  # ---------------------------------------------------------------------------
  # iOS build-once: match(readonly) → gym → .ipa, uploaded as an artifact for the
  # publish-ios job. No TestFlight upload here. Skipped (not failed) when the Apple
  # secrets are absent, so a green tag can still be reached from Android alone.
  # ---------------------------------------------------------------------------
  build-ios:
    name: iOS build (gate, build-once)
    needs: version
    if: needs.version.outputs.ios_ready == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      packages: read    # gradle runs inside the Xcode framework build phase (fastlane gym)
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fail fast with a readable message if the Apple secrets aren't set, instead of
      # letting match/gym error deep in the build.
      - name: Verify Apple credentials are present
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in MATCH_GIT_URL MATCH_PASSWORD APP_STORE_CONNECT_API_KEY_ID \
                   APP_STORE_CONNECT_API_KEY_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          case "$MATCH_GIT_URL" in
            https://*)      [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ] && missing="$missing MATCH_GIT_BASIC_AUTHORIZATION" ;;
            git@*|ssh://*)  [ -z "$MATCH_GIT_SSH_KEY" ] && missing="$missing MATCH_GIT_SSH_KEY" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error::Missing iOS release secrets:$missing. Nothing to build."
            exit 1
          fi

      - name: Set up SSH agent for match
        if: ${{ env.MATCH_GIT_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_KEY }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: latest-stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true

      - name: Cache Konan
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'settings.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Apply extra gradle.properties
        env:
          EXTRA_GRADLE_PROPERTIES: ${{ secrets.EXTRA_GRADLE_PROPERTIES }}
        run: |
          if [ -z "$EXTRA_GRADLE_PROPERTIES" ]; then
            echo "EXTRA_GRADLE_PROPERTIES not set — skipping."
            exit 0
          fi
          printf '\n%s\n' "$EXTRA_GRADLE_PROPERTIES" >> gradle.properties
          echo "Appended $(printf '%s' "$EXTRA_GRADLE_PROPERTIES" | grep -c '=') extra gradle propert(ies)."

      - name: Set up Ruby + bundler
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
          working-directory: ${{ inputs.ios-directory }}

      - name: iOS pre-build Gradle task
        if: ${{ inputs.ios-prebuild-gradle-task != '' }}
        run: ./gradlew ${{ inputs.ios-prebuild-gradle-task }} --stacktrace

      # Build lane: match(readonly) → gym → .ipa. Must NOT upload to TestFlight.
      - name: fastlane ios build (match → gym)
        working-directory: ${{ inputs.ios-directory }}
        env:
          CI: "true"
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ needs.version.outputs.build }}
          MARKETING_VERSION: ${{ needs.version.outputs.name }}
        run: bundle exec fastlane ios ${{ inputs.ios-build-lane }}

      # Hand the .ipa (and dSYMs if gym emitted them) to publish-ios. gym's output
      # directory is app-specific (e.g. iosApp/build/fastlane), so search recursively
      # under the ios-directory rather than assuming a fixed location.
      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-ios
          if-no-files-found: error
          path: |
            ${{ inputs.ios-directory }}/**/*.ipa
            ${{ inputs.ios-directory }}/**/*.app.dSYM.zip

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-logs
          if-no-files-found: ignore
          path: |
            ~/Library/Logs/gym/
            ${{ inputs.ios-directory }}/fastlane/report.xml

  # ---------------------------------------------------------------------------
  # The gate. Reached only when BOTH build jobs finished without failure — an
  # unconfigured iOS is SKIPPED (does not block), but a FAILED iOS build blocks
  # this job (so no tag, and the publish jobs below never run). This is the whole
  # point: the version/tag is committed only once both platforms are known to build.
  # ---------------------------------------------------------------------------
  tag:
    name: Push release tag
    needs: [version, compile-android, build-ios]
    # This `if:` is load-bearing. A job whose dependency is SKIPPED is itself
    # skipped by default, so without it an app with no Apple secrets (build-ios
    # skipped) never reaches `tag` — and therefore never reaches publish-android
    # either, because that needs `tag`. The run then reports SUCCESS having
    # released nothing at all: no tag pushed, nothing on Play. Verified against
    # AdaptiveVol run 30255346379, which resolved 1.4.10 and shipped none of it.
    # Tolerate a skipped iOS build; still block on a failed one.
    if: >-
      !cancelled()
      && needs.compile-android.result == 'success'
      && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # For a manual dispatch that will actually publish, create + push the release tag
      # so the shipped version maps 1:1 to a git tag. Skipped for tag pushes (already
      # exists) and pure dry-runs. Pushing with the default GITHUB_TOKEN does NOT
      # re-trigger the caller — the publish jobs run in THIS run via `needs`.
      - name: Create release tag
        if: >-
          github.event_name == 'workflow_dispatch'
          && (needs.version.outputs.android_ready == 'true' || needs.version.outputs.ios_ready == 'true')
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists — bump the version or delete the tag."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # ---------------------------------------------------------------------------
  # Android → Google Play (Gradle Play Publisher). Runs after the tag exists.
  # Rebuilds the AAB on the cheap ubuntu runner and publishes it, so the app's
  # build.gradle.kts needs no artifactDir wiring. Publishes only when both a real
  # keystore and Play credentials are present; otherwise it's a dry-run build.
  # ---------------------------------------------------------------------------
  publish-android:
    name: Android → Play
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release + upload the AAB
      packages: read    # resolve a shared version catalog if the app consumes one
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true

      - name: Apply extra gradle.properties
        env:
          EXTRA_GRADLE_PROPERTIES: ${{ secrets.EXTRA_GRADLE_PROPERTIES }}
        run: |
          if [ -z "$EXTRA_GRADLE_PROPERTIES" ]; then
            echo "EXTRA_GRADLE_PROPERTIES not set — skipping."
            exit 0
          fi
          printf '\n%s\n' "$EXTRA_GRADLE_PROPERTIES" >> gradle.properties
          echo "Appended $(printf '%s' "$EXTRA_GRADLE_PROPERTIES" | grep -c '=') extra gradle propert(ies)."

      - name: Configure release signing
        id: signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD<<__EOF__"
              echo "$RELEASE_STORE_PASSWORD"
              echo "__EOF__"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS<<__EOF__"
              echo "$RELEASE_KEY_ALIAS"
              echo "__EOF__"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD<<__EOF__"
              echo "$RELEASE_KEY_PASSWORD"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_B64 not set — building a DEBUG-signed, unpublishable AAB (dry-run)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android pre-build Gradle task
        if: ${{ inputs.android-prebuild-gradle-task != '' }}
        run: >-
          ./gradlew ${{ inputs.android-prebuild-gradle-task }}
          -PappVersionCode=${{ needs.version.outputs.code }}
          -PappVersionName=${{ needs.version.outputs.name }}
          --stacktrace

      - name: Build release bundle
        run: >-
          ./gradlew :${{ inputs.android-module }}:bundleRelease
          -PappVersionCode=${{ needs.version.outputs.code }}
          -PappVersionName=${{ needs.version.outputs.name }}
          --stacktrace

      - name: Configure Play credentials
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish App Bundle to Play
        if: steps.signing.outputs.signed == 'true' && steps.play.outputs.available == 'true'
        run: >-
          ./gradlew :${{ inputs.android-module }}:publishReleaseBundle
          -PenablePlayPublisher
          -PplayTrack=${{ inputs.track }}
          -PappVersionCode=${{ needs.version.outputs.code }}
          -PappVersionName=${{ needs.version.outputs.name }}
          --stacktrace

      - name: Clean up Play credentials
        if: always()
        run: rm -f play-service-account.json

      - name: Create GitHub Release
        if: >-
          github.ref_type == 'tag'
          || (steps.signing.outputs.signed == 'true' && steps.play.outputs.available == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            ${{ inputs.android-module }}/build/outputs/bundle/release/*.aab \
            --title "$GITHUB_REPOSITORY_OWNER ${GITHUB_REPOSITORY#*/} $TAG" \
            --generate-notes

  # ---------------------------------------------------------------------------
  # iOS → TestFlight. Runs after the tag exists. Downloads the .ipa built in
  # build-ios and uploads it (pilot) — no rebuild, so the expensive macOS build
  # happens exactly once. Skipped when the Apple secrets are absent.
  # ---------------------------------------------------------------------------
  publish-ios:
    name: iOS → TestFlight
    needs: [version, tag]
    if: needs.version.outputs.ios_ready == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby + bundler
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
          working-directory: ${{ inputs.ios-directory }}

      - name: Download iOS build artifact
        uses: actions/download-artifact@v6
        with:
          name: release-ios
          path: ${{ inputs.ios-directory }}/artifacts

      - name: Locate the .ipa
        id: ipa
        run: |
          IPA="$(find "${{ inputs.ios-directory }}/artifacts" -name '*.ipa' -type f | head -n1)"
          [ -n "$IPA" ] || { echo "::error::No .ipa in the release-ios artifact."; exit 1; }
          echo "path=$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")" >> "$GITHUB_OUTPUT"
          echo "Uploading $IPA"

      # Upload lane: pilot/upload_to_testflight of ENV["IPA_PATH"]. No match/gym here.
      - name: fastlane ios upload (pilot)
        working-directory: ${{ inputs.ios-directory }}
        env:
          CI: "true"
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: bundle exec fastlane ios ${{ inputs.ios-upload-lane }}
