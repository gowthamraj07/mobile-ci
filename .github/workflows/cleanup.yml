name: Repo housekeeping (reusable)

# Scheduled cleanup for a consumer repo: prune old workflow runs, and (optionally)
# old GHCR container image versions for apps that publish a server/Docker image.
#
# Call it from an app repo:
#
#   on:
#     schedule: [ { cron: "0 0 * * 0" } ]   # weekly
#     workflow_dispatch:
#   jobs:
#     cleanup:
#       permissions:
#         actions: write     # delete workflow runs
#         packages: write    # delete container versions (only if container-package set)
#       uses: gowthamraj07/mobile-ci/.github/workflows/cleanup.yml@v1
#       with:
#         container-package: drive-smart-server   # omit for app-only repos
on:
  workflow_call:
    inputs:
      retain-days:
        description: Delete workflow runs older than this many days.
        type: number
        default: 30
      keep-minimum-runs:
        description: Always keep at least this many recent runs.
        type: number
        default: 10
      container-package:
        description: >-
          GHCR container package name to prune (blank = skip container cleanup).
        type: string
        default: ""
      container-min-versions-to-keep:
        description: >-
          How many of the newest TAGGED images to keep. Counted in images, not
          in GitHub package versions, so this is a real number of releases.
        type: number
        default: 10
      container-exclude-tags:
        description: >-
          Comma-separated tags never deleted, whatever their age. Wildcards
          allowed.
        type: string
        default: "latest,main,master,develop,staging,production"
      container-dry-run:
        description: >-
          Log what would be deleted and delete nothing. Use it from
          workflow_dispatch before trusting a change to the keep rules.
        type: boolean
        default: false

jobs:
  runs:
    name: Prune old workflow runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.retain-days }}
          keep_minimum_runs: ${{ inputs.keep-minimum-runs }}

  # Why this job is not `actions/delete-package-versions` any more.
  #
  # A buildx multi-arch publish creates THREE GitHub package versions per build:
  # the manifest list that carries the tag, plus one untagged child manifest per
  # architecture. actions/delete-package-versions counts package versions and
  # knows nothing about manifest lists, which broke this two ways on DriveSmart
  # (verified 2026-11-01, run 41266470229):
  #
  #   * `min-versions-to-keep: 10` counted versions, not releases -- about three
  #     publishes of history -- and `ignore-versions` protected only moving tags
  #     like `latest`, so version tags 1.0.7 through 1.0.12 were all deleted
  #     within hours of 1.0.13 being published. The digests behind them now
  #     answer `manifest unknown`: there was no rollback image left.
  #   * the untagged step treated per-arch children as garbage, so it could
  #     delete the platform manifests out from under a tag it had just decided
  #     to keep, leaving a tag that resolves but cannot be pulled.
  #
  # The replacement reasons in images rather than package versions.
  containers:
    name: Prune old container images
    if: ${{ inputs.container-package != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Multi-arch aware, which actions/delete-package-versions is not. See the
      # note above the job for what that cost us.
      - name: Prune old container images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ inputs.container-package }}
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: ${{ inputs.container-min-versions-to-keep }}
          exclude-tags: ${{ inputs.container-exclude-tags }}
          # Deliberately NOT pruning untagged images. A multi-arch publish's
          # per-arch children are untagged by design, and this action's docs do
          # not actually promise that children of a KEPT image are excluded from
          # `keep-n-untagged` -- they recommend verifying with a dry run. Rather
          # than depend on an unverified guarantee to protect live images, the
          # untagged rules stay off: deleting a tagged image here cascades to its
          # own children correctly, which is the only deletion we want.
          delete-untagged: false
          # Safe regardless: these are multi-arch images whose platform images
          # are ALL already missing, i.e. unpullable wreckage, most of it left
          # behind by the action this step replaces.
          delete-ghost-images: true
          validate: true
          dry-run: ${{ inputs.container-dry-run }}
