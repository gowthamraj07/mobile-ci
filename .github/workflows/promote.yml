name: Play track promotion (reusable)

# Promote an already-published Android release from one Google Play track to another
# via Gradle Play Publisher's `promoteReleaseArtifact`, decoupled from building a new
# binary. No new AAB is built.
#
# Call it from an app repo:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         from-track: { type: choice, options: [ internal, alpha, beta ] }
#         to-track:   { type: choice, options: [ alpha, beta, production ] }
#   jobs:
#     promote:
#       uses: gowthamraj07/mobile-ci/.github/workflows/promote.yml@v1
#       with:
#         from-track: ${{ inputs.from-track }}
#         to-track: ${{ inputs.to-track }}
#       secrets:
#         PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
#
# WHICH HOPS ARE LEGAL IS THE APP'S POLICY, declared in `allowed-promotions` and
# enforced here. The default is the full ladder, one rung at a time:
#
#     internal → alpha → beta → production
#
# so by default `internal → production` in one hop is REJECTED — that friction is
# what stops a production rollout being one careless click from an unvalidated build.
#
# An app whose testing lanes are a subset of the ladder declares its own. A team that
# tests on the internal track only and runs no closed/open testing has no alpha or
# beta to hop through, and the ladder default would make its ONLY real promotion
# impossible:
#
#       with:
#         allowed-promotions: internal->production
#
# Keep the list to the hops the app's testing process actually validates. It is a
# policy statement, reviewable in the app repo's diff — not a bypass flag.
#
# Conventions (same as release.yml): Android module `composeApp` applying GPP behind
# -PenablePlayPublisher (GPP reads play-service-account.json at the repo root).
on:
  workflow_call:
    inputs:
      android-module:
        description: Gradle module that owns the Play release.
        type: string
        default: composeApp
      java-version:
        type: string
        default: "17"
      from-track:
        description: Source Play track.
        type: string
        required: true
      to-track:
        description: Target Play track.
        type: string
        required: true
      allowed-promotions:
        description: >-
          Promotion hops this app permits, as "from->to" pairs separated by commas or
          newlines (spaces around the arrow are fine). Defaults to the strict ladder;
          an app with no closed/open testing lane overrides it, e.g.
          "internal->production".
        type: string
        default: internal->alpha, alpha->beta, beta->production
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        description: JSON of the Play service account (release-manager permission).
        required: false

jobs:
  promote:
    name: Promote ${{ inputs.from-track }} → ${{ inputs.to-track }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only allow the hops this app declared; reject everything else.
      - name: Validate promotion path
        env:
          FROM: ${{ inputs.from-track }}
          TO: ${{ inputs.to-track }}
          ALLOWED: ${{ inputs.allowed-promotions }}
        run: |
          # Normalise the policy into space-separated "from->to" tokens, so a comma
          # list, a YAML block scalar and "internal -> alpha" all parse the same.
          allowed="$(printf '%s' "$ALLOWED" | tr ',\n\t' '   ' | sed 's/ *-> */->/g')"
          allowed="$(printf '%s' "$allowed" | tr -s ' ' | sed 's/^ //; s/ $//')"

          if [ -z "$allowed" ]; then
            echo "::error::allowed-promotions is empty — this app permits no promotion at all."
            exit 1
          fi

          want="$FROM->$TO"
          for hop in $allowed; do
            if [ "$hop" = "$want" ]; then
              echo "Valid: $FROM → $TO"
              exit 0
            fi
          done

          echo "::error::Invalid promotion path: $FROM → $TO. This app allows: $allowed. Change allowed-promotions in the calling workflow if the app's process really does permit this hop."
          exit 1

      - name: Verify Play credentials are present
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON not set — nothing to promote."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true

      - name: Configure Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Promote release
        run: >-
          ./gradlew :${{ inputs.android-module }}:promoteReleaseArtifact
          -PenablePlayPublisher
          --from-track=${{ inputs.from-track }}
          --promote-track=${{ inputs.to-track }}
          --stacktrace

      - name: Clean up Play credentials
        if: always()
        run: rm -f play-service-account.json
